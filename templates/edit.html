<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<title>Редактирование</title>

<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="container">

<h1>✏ Редактирование записи</h1>

<form method="POST">

<input
type="text"
name="title"
value="{{ note[1] }}"
required>

<textarea
name="description"
required>{{ note[2] }}</textarea>

<input
type="date"
name="deadline"
value="{{ note[3] }}"
required>

<button type="submit">

Сохранить изменения

</button>

</form>

</div>

</body>

</html>
